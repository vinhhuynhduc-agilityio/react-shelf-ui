<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My book shelf</title>

    <!--  Meta Description for SEO -->
    <meta name="description" content="My Book Shelf - Organize and explore your favorite books with personalized shelves, categories, and previews." />

     <!-- Preconnect to Cloudinary to improve performance  -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

     <!-- Preconnect to API (Render)  -->
    <link rel="preconnect" href="https://react-shelf-api.onrender.com" crossorigin />

     <!-- (Optional) DNS Prefetch fallback  -->
    <link rel="dns-prefetch" href="https://react-shelf-api.onrender.com" />

     <!-- Preload LCP image  -->
    <link
      rel="preload"
      as="image"
      href="https://res.cloudinary.com/dz0z0qlal/image/upload/w_130,h_170,c_fill,f_auto,q_auto/v1753157928/4aa430788b3938ca7d778a99fe0ff1587c81c67e_1_hsfarj_qpn4fz.webp"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
